<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyCareBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faede6"/>
      <stop offset="100%" stop-color="#eed5c5"/>
    </linearGradient>
  </defs>
  <rect width="650" height="350" fill="url(#bodyCareBg)" rx="16"/>
  <!-- Botanical branch illustration -->
  <g stroke="#7d8c55" stroke-width="2" fill="none" opacity="0.35" transform="translate(420, 40)">
    <path d="M 10 240 Q 60 140 160 40"/>
    <path d="M 60 180 Q 90 150 110 170" fill="#7d8c55"/>
    <path d="M 90 130 Q 130 110 140 140" fill="#7d8c55"/>
    <path d="M 130 80 Q 170 70 170 100" fill="#7d8c55"/>
  </g>
  <!-- Gentle Hands applying pure organic cream -->
  <g transform="translate(60, 40)">
    <!-- Hand 1 -->
    <path d="M 40 220 C 60 160, 110 130, 170 140 C 210 150, 240 180, 270 200 C 220 230, 150 250, 90 260 Z" fill="#edd0be"/>
    <!-- Hand 2 massaging -->
    <path d="M 290 240 C 250 180, 200 150, 150 160 C 130 130, 180 90, 240 100 C 290 110, 330 160, 350 220 Z" fill="#fcd9c3"/>
    <!-- Cream dollop & swirl -->
    <ellipse cx="210" cy="155" rx="25" ry="14" fill="#ffffff" opacity="0.9"/>
    <path d="M 195 155 Q 210 142 225 152 Q 220 162 205 160" stroke="#f0ebe4" stroke-width="3" fill="none"/>
  </g>
</svg>
