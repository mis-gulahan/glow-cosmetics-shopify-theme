<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dropperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d1a15"/>
      <stop offset="50%" stop-color="#4a2c24"/>
      <stop offset="100%" stop-color="#241410"/>
    </linearGradient>
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#733d16"/>
      <stop offset="40%" stop-color="#b86927"/>
      <stop offset="80%" stop-color="#d48239"/>
      <stop offset="100%" stop-color="#542c10"/>
    </linearGradient>
    <filter id="shadowDrop">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="175" cy="405" rx="80" ry="14" fill="#000" opacity="0.1" filter="blur(6px)"/>

  <!-- Petals background accent -->
  <path d="M 90 400 Q 120 380 150 410 Q 110 420 90 400 Z" fill="#f8bbd0" opacity="0.6"/>
  <path d="M 210 405 Q 240 375 265 400 Q 235 425 210 405 Z" fill="#f48fb1" opacity="0.6"/>
  <path d="M 130 420 Q 160 435 190 415 Q 160 410 130 420 Z" fill="#fce4ec" opacity="0.7"/>

  <g filter="url(#shadowDrop)">
    <!-- Dropper Bulb -->
    <path d="M 155 70 C 155 45, 195 45, 195 70 Z" fill="url(#dropperGrad)"/>
    <!-- Dropper Collar -->
    <rect x="150" y="70" width="50" height="28" rx="3" fill="#1b1b1b"/>
    <line x1="150" y1="84" x2="200" y2="84" stroke="#444" stroke-width="1.5"/>

    <!-- Glass Shoulder & Body -->
    <rect x="156" y="98" width="38" height="12" fill="#542c10"/>
    <path d="M 125 140 C 125 110, 150 108, 160 108 L 190 108 C 200 108, 225 110, 225 140 L 225 370 C 225 385, 210 395, 175 395 C 140 395, 125 385, 125 370 Z" fill="url(#amberGlass)"/>
    
    <!-- Glass Highlight -->
    <rect x="135" y="130" width="8" height="230" rx="4" fill="#ffffff" opacity="0.25" filter="blur(1px)"/>

    <!-- Minimalist Bottle Label -->
    <rect x="135" y="195" width="80" height="115" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="175" y="222" font-family="'Playfair Display', serif" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="2">GLOW.</text>
    <line x1="150" y1="230" x2="200" y2="230" stroke="#7d8c55" stroke-width="1"/>
    <text x="175" y="244" font-family="'Jost', sans-serif" font-size="7.5" font-weight="600" fill="#2b2b2b" text-anchor="middle">DRY SKIN OIL</text>
    <text x="175" y="258" font-family="'Jost', sans-serif" font-size="6" fill="#767676" text-anchor="middle">PURE BOTANICAL</text>
    <text x="175" y="280" font-family="'Jost', sans-serif" font-size="6" fill="#999999" text-anchor="middle">50ml e 1.7 fl oz</text>
  </g>
</svg>
