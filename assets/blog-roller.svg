<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <rect width="400" height="280" fill="#f8f4f0"/>
  <!-- Facial Jade Roller -->
  <g transform="translate(150, 40) rotate(25 100 100)">
    <!-- Top roller stone -->
    <rect x="70" y="20" width="60" height="22" rx="11" fill="#a4b494" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
    <!-- Metal bracket -->
    <path d="M 68 31 L 55 50 L 90 70 L 100 80" stroke="#d4af37" stroke-width="4" fill="none"/>
    <path d="M 132 31 L 145 50 L 110 70 L 100 80" stroke="#d4af37" stroke-width="4" fill="none"/>
    <!-- Handle -->
    <rect x="94" y="80" width="12" height="100" rx="6" fill="#a4b494"/>
    <!-- Bottom roller -->
    <rect x="80" y="190" width="40" height="16" rx="8" fill="#a4b494"/>
  </g>
</svg>
