<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faede6"/>
      <stop offset="100%" stop-color="#f2dfd5"/>
    </linearGradient>
  </defs>
  <rect width="500" height="450" fill="url(#splitBg)" rx="16"/>
  
  <!-- Central Split Line Divider -->
  <line x1="250" y1="20" x2="250" y2="430" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="250" cy="225" r="18" fill="#ffffff" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.15))"/>
  <path d="M 244 225 L 248 221 M 244 225 L 248 229 M 256 225 L 252 221 M 256 225 L 252 229" stroke="#7d8c55" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Side: Model Face Before Glow -->
  <g transform="translate(40, 50)">
    <circle cx="160" cy="160" r="100" fill="#edd0be"/>
    <text x="70" y="320" font-family="'Jost', sans-serif" font-size="12" font-weight="600" fill="#888888" letter-spacing="2">BEFORE TREATMENT</text>
    <!-- Tired eye / dull skin hint -->
    <path d="M 120 150 Q 140 160 160 152" stroke="#5c4033" stroke-width="2" fill="none"/>
    <circle cx="130" cy="180" r="12" fill="#c49b88" opacity="0.4"/>
  </g>

  <!-- Right Side: Model Face Radiant After Glow -->
  <g transform="translate(150, 50)">
    <circle cx="160" cy="160" r="100" fill="#fce5d4"/>
    <text x="180" y="320" font-family="'Jost', sans-serif" font-size="12" font-weight="700" fill="#7d8c55" letter-spacing="2">WITH GLOW. ACTIVES</text>
    <!-- Radiant smile and luminous skin -->
    <path d="M 170 148 Q 190 140 210 148" stroke="#3d2216" stroke-width="2.5" fill="none"/>
    <circle cx="190" cy="170" r="20" fill="#ff8a80" opacity="0.3" filter="blur(6px)"/>
    <!-- Glow stars -->
    <polygon points="230,110 233,116 239,118 233,120 230,126 227,120 221,118 227,116" fill="#7d8c55"/>
    <polygon points="160,80 162,84 167,86 162,88 160,92 158,88 153,86 158,84" fill="#7d8c55"/>
  </g>
</svg>
